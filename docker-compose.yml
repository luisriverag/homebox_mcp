# Adds the Homebox MCP / Telegram agent alongside your EXISTING self-hosted
# Homebox instance. Point HOMEBOX_URL (in .env) at that instance and, if it
# runs in its own docker-compose stack, put this service on the same Docker
# network so it can reach it by container name.
#
#   docker compose up -d homebox-agent
#
# Two optional demo services (`homebox` + `homebox-db`) are included behind
# the "demo" profile if you want to try this against a throwaway local
# Homebox instead of your real one:
#
#   docker compose --profile demo up -d
#   # then set HOMEBOX_URL=http://homebox:7745 in .env

services:
  homebox-agent:
    build: .
    container_name: homebox-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # This service runs as a long-lived Telegram bot. Run the MCP stdio
      # server separately (see README) from whatever spawns MCP clients.
      MODE: telegram
    # Uncomment and point at the external network your real Homebox
    # deployment already uses, so this container can resolve it by name:
    # networks:
    #   - homebox_default

  homebox:
    image: ghcr.io/sysadminsmedia/homebox:latest
    profiles: ["demo"]
    container_name: homebox-demo
    restart: unless-stopped
    environment:
      HBOX_DATABASE_TYPE: sqlite3
      HBOX_DATABASE_SQLITE_PATH: /data/homebox.db
    volumes:
      - homebox-demo-data:/data
    ports:
      - "7745:7745"

volumes:
  homebox-demo-data:

